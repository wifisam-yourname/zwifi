name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject license secret
        env:
          LIC: ${{ secrets.LIC_SECRET }}
        run: |
          test -n "$LIC"
          sed -i "s/__LIC_SECRET__/$LIC/" app/src/main/python/zwifi.py
          ! grep -q __LIC_SECRET__ app/src/main/python/zwifi.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle assembleDebug --no-daemon

      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk Z-Wifi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Z-Wifi-apk
          path: Z-Wifi.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Z-Wifi.apk
